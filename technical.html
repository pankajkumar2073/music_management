<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Requirements | FestManage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"></div>

    <nav class="navbar">
        <div class="logo"><span>🎵</span> FestManage</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="artists.html">Artists</a></li>
            <li><a href="stages.html">Stages</a></li>
            <li><a href="slots.html">Slots</a></li>
            <li><a href="technical.html" class="active">Technical</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="conflicts.html">Conflicts</a></li>
        </ul>
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-title">
            <h1>🎛️ Technical Requirements</h1>
        </div>

        <!-- Add Tech Form -->
        <div class="form-card">
            <h2>➕ Add Technical Requirements</h2>
            <form id="tech-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Artist *</label>
                        <select id="tech-artist" class="artist-select" required>
                            <option value="">Select Artist</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Power Requirement</label>
                        <input type="text" id="tech-power" placeholder="e.g. 15 kW">
                    </div>
                </div>
                <div class="form-group">
                    <label>Equipment / Rider *</label>
                    <textarea id="tech-items" placeholder="e.g. 2x CDJ-3000, DJM Mixer, LED Wall, Wireless Mics..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Special Notes</label>
                    <textarea id="tech-notes" placeholder="Soundcheck time, lighting preferences, etc."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Requirements</button>
            </form>
        </div>

        <!-- Tech List -->
        <h2 style="margin-bottom:1.2rem;color:var(--neon-cyan)">All Technical Requirements</h2>
        <div class="card-grid" id="tech-list">
            <!-- Filled by JS -->
        </div>
    </div>

    <footer>
        <p>Music Festival Artist Management System · CSE326 Project</p>
    </footer>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
