<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Allocation | FestManage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-animation"></div>

    <nav class="navbar">
        <div class="logo"><span>🎵</span> FestManage</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="artists.html">Artists</a></li>
            <li><a href="stages.html" class="active">Stages</a></li>
            <li><a href="slots.html">Slots</a></li>
            <li><a href="technical.html">Technical</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="conflicts.html">Conflicts</a></li>
        </ul>
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-title">
            <h1>🏟️ Stage Allocation</h1>
        </div>

        <!-- Add Stage Form -->
        <div class="form-card">
            <h2>➕ Add New Stage</h2>
            <form id="stage-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Stage Name *</label>
                        <input type="text" id="stage-name" placeholder="e.g. Main Stage" required>
                    </div>
                    <div class="form-group">
                        <label>Capacity *</label>
                        <input type="number" id="stage-capacity" placeholder="e.g. 10000" min="100" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="stage-location" placeholder="e.g. North Field">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="stage-status">
                            <option value="active">Active</option>
                            <option value="maintenance">Maintenance</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Add Stage</button>
            </form>
        </div>

        <!-- Stages List -->
        <h2 style="margin-bottom:1.2rem;color:var(--neon-cyan)">All Stages</h2>
        <div class="card-grid" id="stages-list">
            <!-- Filled by JS -->
        </div>
    </div>

    <footer>
        <p>Music Festival Artist Management System · CSE326 Project</p>
    </footer>

    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
</body>
</html>
